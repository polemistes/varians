# nginx in front of Varians, which listens on 127.0.0.1:3000. Replace
# editions.example.org with your domain and the certificate paths with
# yours (certbot --nginx, or certbot certonly --webroot, writes them).
# Install: /etc/nginx/conf.d/varians.conf (or sites-available, linked from
# sites-enabled), then nginx -t && systemctl reload nginx.

server {
    listen 80;
    listen [::]:80;
    server_name editions.example.org;
    return 301 https://editions.example.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name editions.example.org;

    ssl_certificate     /etc/letsencrypt/live/editions.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/editions.example.org/privkey.pem;

    # Image uploads of up to 100 MB, as BODY_SIZE_LIMIT allows.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Varians counts logins and resets by the visitor's address (ADDRESS_HEADER, XFF_DEPTH=1).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Imports and archive exports can take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Uploads go straight through rather than being held in a temporary file first.
        proxy_request_buffering off;
    }
}
