# varians.eu on port 443: Apache holds the certificate and passes every
# request on to Varians, which listens only on the server itself.
# Install: /etc/httpd/conf/conf.d/varians.eu-ssl.conf, once the certificate exists.

<VirtualHost *:443>
    ServerName varians.eu
    ServerAlias www.varians.eu
    ErrorLog "/var/log/httpd/varians.eu-error_log"
    CustomLog "/var/log/httpd/varians.eu-access_log" combined

    SSLCertificateFile /etc/letsencrypt/live/varians.eu/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/varians.eu/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # One address for the site: www.varians.eu goes to varians.eu.
    RewriteEngine on
    RewriteCond %{HTTP_HOST} ^www\. [NC]
    RewriteRule ^ https://varians.eu%{REQUEST_URI} [END,NE,R=permanent]

    # Pass everything on to Varians. Imports and archive exports can take a while.
    ProxyPreserveHost On
    ProxyTimeout 300
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
