# varians.eu on port 80: everything is sent on to https. certbot also proves
# here that the domain is ours when it fetches or renews the certificate.
# Install: /etc/httpd/conf/conf.d/varians.eu.conf

<VirtualHost *:80>
    ServerName varians.eu
    ServerAlias www.varians.eu
    ErrorLog "/var/log/httpd/varians.eu-error_log"
    CustomLog "/var/log/httpd/varians.eu-access_log" combined

    RewriteEngine on
    RewriteRule ^ https://varians.eu%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
