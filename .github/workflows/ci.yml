# On every push and pull request: types, the tests of the core and of the
# web application (against PostgreSQL 18), the build, the licences of the
# production dependencies, and the container image with a smoke test of the
# compose file, its backup and its restore.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: varians
          POSTGRES_DB: varians_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U varians -d varians_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://varians@127.0.0.1:54329/varians_test
      DATABASE_URL_TEST: postgres://varians@127.0.0.1:54329/varians_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm check
      - name: Core tests
        run: pnpm --filter @varians/core test
      - name: Migrations
        run: pnpm db:migrate
      - name: Web tests
        run: pnpm --filter @varians/web test
      - name: Build
        run: pnpm --filter @varians/web build
        env:
          VARIANS_COMMIT: ${{ github.sha }}
      - name: Licences of the production dependencies
        run: pnpm --filter @varians/web exec tsx scripts/check-licences.ts

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/polemistes/varians:ci
          build-args: VARIANS_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start with compose
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|; s|^ORIGIN=.*|ORIGIN=http://localhost:3000|" .env
          echo "VARIANS_VERSION=ci" >> .env
          docker compose config --quiet
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:3000/api/version
          curl -fsS http://127.0.0.1:3000/ > /dev/null
      - name: Back up and restore
        run: |
          docker compose exec -T varians varians cli version
          docker compose exec -T varians varians backup /data/backups/ci
          docker compose exec -T varians ls -l /data/backups/ci
          docker compose stop varians
          docker compose run --rm -T varians restore /data/backups/ci --yes
          docker compose start varians
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/health | grep -q '"status":"ok"'
      - name: Logs
        if: always()
        run: docker compose logs --no-color || true
      - name: Stop
        if: always()
        run: docker compose down -v || true
