# On a tag v<version> (for instance v0.2.0, matching apps/web/package.json):
# the image for linux/amd64 and linux/arm64 to ghcr.io/polemistes/varians,
# the native tarballs for x64 and arm64, and a GitHub release carrying the
# tarballs, with the CHANGELOG.md section of the version as its notes.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package=$(node -p "require('./apps/web/package.json').version")
          if [ "$tag" != "$package" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the version $package in apps/web/package.json." >&2
            exit 1
          fi
          deploy/release-notes.sh "$package" > /dev/null
          echo "version=$package" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  image:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/polemistes/varians
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VARIANS_COMMIT=${{ needs.prepare.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tarball:
    needs: prepare
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Build the tarball
        run: deploy/release.sh dist
        env:
          VARIANS_COMMIT: ${{ needs.prepare.outputs.commit }}
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.runner }}
          path: dist/*
          retention-days: 7

  release:
    needs: [prepare, image, tarball]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          deploy/release-notes.sh "$VERSION" > notes.md
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Varians $VERSION" --notes-file notes.md --verify-tag $prerelease
